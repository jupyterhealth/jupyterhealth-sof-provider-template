[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterhealth-sof-provider-app"
version = "0.1.0"
description = "SMART on FHIR provider app on JupyterHealth Exchange"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "jupyter-smart-on-fhir==0.1.0a4",
    "jupyterhealth-client>=0.2.0",
    "voila>=0.5",
    "jupyter-server>=2.0",
    "ipykernel>=6.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "matplotlib>=3.7",
    # ipywidgets + anywidget power interactive (ipywidgets/Plotly FigureWidget)
    # dashboards under Voilà — e.g. the examples/cgm-dashboard.ipynb showcase.
    "ipywidgets>=8.0",
    "anywidget>=0.9",
    "python-dotenv>=1.0",
    "requests>=2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "nbformat>=5.9"]

[tool.setuptools]
packages = ["provider_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
